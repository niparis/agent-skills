<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:18px 20px;}
.sw{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.chip{border:0.5px solid var(--border);border-radius:8px;overflow:hidden;}
.chip .cap{height:52px;border-bottom:0.5px solid var(--border);}
.chip .meta{padding:8px 10px;background:var(--surface-card);}
.chip .nm{font-size:11px;font-weight:500;}
.chip .hex{font-family:var(--mono);font-size:10px;color:var(--text-muted);}
</style></head><body>
<div class="sw">
  <div class="chip"><div class="cap" style="background:#F5F3EC"></div><div class="meta"><div class="nm">Background</div><div class="hex">#F5F3EC · --bg</div></div></div>
  <div class="chip"><div class="cap" style="background:#EDEAE0"></div><div class="meta"><div class="nm">Surface</div><div class="hex">#EDEAE0 · --surface</div></div></div>
  <div class="chip"><div class="cap" style="background:#F0EEE7"></div><div class="meta"><div class="nm">Surface Card</div><div class="hex">#F0EEE7 · --surface-card</div></div></div>
  <div class="chip"><div class="cap" style="background:#D0CCC0"></div><div class="meta"><div class="nm">Border</div><div class="hex">#D0CCC0 · --border</div></div></div>
  <div class="chip"><div class="cap" style="background:#E0DDD4"></div><div class="meta"><div class="nm">Border Subtle</div><div class="hex">#E0DDD4 · --border-subtle</div></div></div>
  <div class="chip"><div class="cap" style="background:#F5F3EC"></div><div class="meta"><div class="nm">Warm paper family</div><div class="hex">never pure white</div></div></div>
</div>
</body></html>
