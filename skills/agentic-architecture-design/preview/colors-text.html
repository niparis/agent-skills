<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px;}
.sw{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.chip{border:0.5px solid var(--border);border-radius:8px;overflow:hidden;}
.chip .cap{height:48px;}
.chip .meta{padding:8px 10px;background:var(--surface-card);}
.chip .nm{font-size:11px;font-weight:500;}
.chip .hex{font-family:var(--mono);font-size:10px;color:var(--text-muted);}
</style></head><body>
<div class="sw">
  <div class="chip"><div class="cap" style="background:#111111"></div><div class="meta"><div class="nm">Text Primary</div><div class="hex">#111111 · --text</div></div></div>
  <div class="chip"><div class="cap" style="background:#444444"></div><div class="meta"><div class="nm">Text Secondary</div><div class="hex">#444444 · --text-secondary</div></div></div>
  <div class="chip"><div class="cap" style="background:#888880"></div><div class="meta"><div class="nm">Text Muted</div><div class="hex">#888880 · --text-muted</div></div></div>
</div>
</body></html>
