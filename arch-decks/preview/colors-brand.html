<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:18px 20px;}
.sw{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.chip{border:0.5px solid var(--border);border-radius:8px;overflow:hidden;}
.chip .cap{height:64px;}
.chip .meta{padding:8px 10px;background:var(--surface-card);}
.chip .nm{font-size:11px;font-weight:500;}
.chip .hex{font-family:var(--mono);font-size:10px;color:var(--text-muted);}
</style></head><body>
<div class="sw">
  <div class="chip"><div class="cap" style="background:#2D6A2D"></div><div class="meta"><div class="nm">Green Primary</div><div class="hex">#2D6A2D · --g-primary</div></div></div>
  <div class="chip"><div class="cap" style="background:#3B7A3B"></div><div class="meta"><div class="nm">Green Accent</div><div class="hex">#3B7A3B · --g-accent</div></div></div>
  <div class="chip"><div class="cap" style="background:#4A8F3F"></div><div class="meta"><div class="nm">Green Light</div><div class="hex">#4A8F3F · --g-light</div></div></div>
  <div class="chip"><div class="cap" style="background:#1B2A6B"></div><div class="meta"><div class="nm">Navy Primary</div><div class="hex">#1B2A6B · --navy</div></div></div>
  <div class="chip"><div class="cap" style="background:#0F1B4C"></div><div class="meta"><div class="nm">Navy Dark</div><div class="hex">#0F1B4C · --navy-dark</div></div></div>
  <div class="chip"><div class="cap" style="background:#C0392B"></div><div class="meta"><div class="nm">Red · negation only</div><div class="hex">#C0392B · --red</div></div></div>
</div>
</body></html>
